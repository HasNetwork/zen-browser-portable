name: Portable Build

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      version:
        description: 'Zen release tag (e.g. "1.19b"). Empty = latest.'
        required: false
        default: ""
      force:
        description: "Force rebuild even if already released"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  # ── Step 1: Check for new release ─────────────────────────────────
  check:
    name: Check for new release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Resolve latest upstream tag
        id: resolve
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -s https://api.github.com/repos/zen-browser/desktop/releases/latest \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          fi
          echo "Upstream tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if already released
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          FORCE="${{ github.event.inputs.force }}"
          RELEASE_TAG="portable-${TAG}"

          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Release '${RELEASE_TAG}' already exists. Skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release needed for $TAG"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Step 2: Build portable packages ──────────────────────────────
  portable:
    name: Portable — ${{ matrix.label }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──
          - label: Windows x64
            platform: windows
            runner: windows-latest
            arch: x86_64
            asset: zen.installer.exe
            output: ZenBrowserPortable-windows-x86_64.zip
          - label: Windows ARM64
            platform: windows
            runner: windows-latest
            arch: arm64
            asset: zen.installer-arm64.exe
            output: ZenBrowserPortable-windows-arm64.zip
          # ── Linux ──
          - label: Linux x64
            platform: linux
            runner: ubuntu-latest
            arch: x86_64
            asset: zen.linux-x86_64.tar.xz
            output: ZenBrowserPortable-linux-x86_64.tar.gz
          - label: Linux ARM64
            platform: linux
            runner: ubuntu-latest
            arch: aarch64
            asset: zen.linux-aarch64.tar.xz
            output: ZenBrowserPortable-linux-aarch64.tar.gz
          # ── macOS ──
          - label: macOS Universal
            platform: macos
            runner: macos-latest
            arch: universal
            asset: zen.macos-universal.dmg
            output: ZenBrowserPortable-macos-universal.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Download upstream release ─────────────────────────────────
      - name: Download ${{ matrix.asset }} (${{ needs.check.outputs.tag }})
        shell: bash
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          URL="https://github.com/zen-browser/desktop/releases/download/${TAG}/${{ matrix.asset }}"
          echo "Downloading $URL ..."
          curl -fSL --retry 3 -o "zen-release-asset" "$URL"
          ls -lh zen-release-asset

      - name: Install 7z (Windows/Linux only)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Install 7z (Windows only)
        if: matrix.platform == 'windows'
        shell: powershell
        run: choco install 7zip -y --no-progress

      # ── Package ───────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Create portable package (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          python build/portable/package.py \
            --installer   zen-release-asset \
            --windows-launcher build/portable/launcher/zen-portable.cmd \
            --user-js     build/portable/launcher/defaults/user.js \
            --assets-dir  build/portable/assets \
            --output      "${{ matrix.output }}"

      - name: Create portable package (Linux)
        if: matrix.platform == 'linux'
        run: |
          python3 build/portable/package.py \
            --tarball        zen-release-asset \
            --shell-launcher build/portable/launcher/zen-portable.sh \
            --user-js        build/portable/launcher/defaults/user.js \
            --assets-dir     build/portable/assets \
            --output         "${{ matrix.output }}"

      - name: Create portable package (macOS)
        if: matrix.platform == 'macos'
        run: |
          python3 build/portable/package.py \
            --dmg            zen-release-asset \
            --shell-launcher build/portable/launcher/zen-portable.sh \
            --user-js        build/portable/launcher/defaults/user.js \
            --assets-dir     build/portable/assets \
            --output         "${{ matrix.output }}"

      # ── Upload ────────────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 5

  # ── Step 3: Build PAF (PortableApps.com Format) ──────────────────
  paf:
    name: PortableApps.com Format (PAF)
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Zen installer (x64)
        shell: bash
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          URL="https://github.com/zen-browser/desktop/releases/download/${TAG}/zen.installer.exe"
          echo "Downloading $URL ..."
          curl -fSL --retry 3 -o zen-installer.exe "$URL"
          ls -lh zen-installer.exe

      - name: Install tools (NSIS, 7-Zip, ImageMagick)
        shell: powershell
        run: |
          choco install nsis 7zip imagemagick -y --no-progress

      - name: Add NSIS to PATH
        shell: bash
        run: |
          echo "C:/Program Files (x86)/NSIS" >> $GITHUB_PATH
          echo "C:/Program Files/NSIS" >> $GITHUB_PATH

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build PAF package
        shell: bash
        run: |
          # Verify makensis is available
          which makensis || echo "makensis not in PATH, searching..."
          find "/c/Program Files" "/c/Program Files (x86)" -name "makensis.exe" 2>/dev/null || true

          python build/portable/build_paf.py \
            --installer   zen-installer.exe \
            --paf-template build/portable/paf \
            --icon         configs/branding/release/logo128.png \
            --version      "${{ needs.check.outputs.tag }}" \
            --output       "ZenBrowserPortable_${{ needs.check.outputs.tag }}.paf.exe" \
            --keep-build-dir \
            --prepare-only

      - name: Require code signing configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT AZURE_ARTIFACT_SIGNING_PROFILE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required to sign Windows executables and avoid SmartScreen's unrecognized-app warning."
              missing=1
            fi
          done
          exit "$missing"

      - name: Azure login for code signing
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign PAF launcher
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\_paf_build\ZenBrowserPortable
          files-folder-filter: exe
          file-digest: SHA256

      - name: Create signed PAF installer
        shell: bash
        run: |
          mkdir -p _paf_sign
          python build/portable/build_paf.py \
            --installer   zen-installer.exe \
            --paf-template build/portable/paf \
            --icon         configs/branding/release/logo128.png \
            --version      "${{ needs.check.outputs.tag }}" \
            --output       "_paf_sign/ZenBrowserPortable_${{ needs.check.outputs.tag }}.paf.exe" \
            --installer-only

      - name: Sign PAF installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\_paf_sign
          files-folder-filter: exe
          file-digest: SHA256

      - name: Move signed PAF installer into release root
        shell: bash
        run: mv "_paf_sign/ZenBrowserPortable_${{ needs.check.outputs.tag }}.paf.exe" .

      - name: Verify output
        shell: bash
        run: |
          PAF="ZenBrowserPortable_${{ needs.check.outputs.tag }}.paf.exe"
          if [ -f "$PAF" ]; then
            echo "✅ PAF built: $PAF ($(du -h "$PAF" | cut -f1))"
          else
            echo "PAF exe not produced, checking for fallback ZIP..."
            ls -la ZenBrowserPortable_* 2>/dev/null || echo "No output files found"
          fi

      - name: Upload PAF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenBrowserPortable-paf
          path: ZenBrowserPortable_${{ needs.check.outputs.tag }}.*
          retention-days: 5

  # ── Step 4: Create GitHub Release ────────────────────────────────
  release:
    name: Publish Release
    needs: [check, portable, paf]
    if: always() && needs.portable.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "portable-${{ needs.check.outputs.tag }}"
          name: "Zen Browser Portable — ${{ needs.check.outputs.tag }}"
          body: |
            ## Zen Browser Portable

            Portable build based on [Zen Browser ${{ needs.check.outputs.tag }}](https://github.com/zen-browser/desktop/releases/tag/${{ needs.check.outputs.tag }}).

            ### Downloads

            | File | Platform | Format |
            |---|---|---|
            | `ZenBrowserPortable-windows-x86_64.zip` | 🪟 Windows x64 | Standalone ZIP |
            | `ZenBrowserPortable-windows-arm64.zip` | 🪟 Windows ARM64 | Standalone ZIP |
            | `ZenBrowserPortable-linux-x86_64.tar.gz` | 🐧 Linux x64 | Standalone |
            | `ZenBrowserPortable-linux-aarch64.tar.gz` | 🐧 Linux ARM64 | Standalone |
            | `ZenBrowserPortable-macos-universal.tar.gz` | 🍎 macOS Universal | Standalone |
            | `ZenBrowserPortable_*.paf.exe` | 🪟 Windows x64 | PortableApps.com Format, signed builds only |

            ### Usage
            - **Standalone**: Download → Extract → Run `zen-portable.cmd` (Windows) or `./zen-portable` (Linux/macOS)
            - **PortableApps.com**: Download the `.paf.exe` → Install via PortableApps.com Platform

            All your data stays inside the `Data/` folder. No installation or admin rights needed.
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          make_latest: true
          files: |
            artifacts/ZenBrowserPortable-windows-x86_64.zip/ZenBrowserPortable-windows-x86_64.zip
            artifacts/ZenBrowserPortable-windows-arm64.zip/ZenBrowserPortable-windows-arm64.zip
            artifacts/ZenBrowserPortable-linux-x86_64.tar.gz/ZenBrowserPortable-linux-x86_64.tar.gz
            artifacts/ZenBrowserPortable-linux-aarch64.tar.gz/ZenBrowserPortable-linux-aarch64.tar.gz
            artifacts/ZenBrowserPortable-macos-universal.tar.gz/ZenBrowserPortable-macos-universal.tar.gz
            artifacts/ZenBrowserPortable-paf/ZenBrowserPortable_*.paf.exe
            artifacts/ZenBrowserPortable-paf/ZenBrowserPortable_*.zip
