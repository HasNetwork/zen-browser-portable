[Format]
Type=PortableApps.comFormat
Version=3.9

[Details]
Name=Zen Browser Portable
AppID=ZenBrowserPortable
Publisher=Zen Browser & PortableApps.com
Homepage=https://github.com/HasNetwork/zen-browser-portable
Category=Internet
Description=A beautifully designed, privacy-focused browser built on Firefox
Language=Multilingual
InstallType=

[License]
Shareable=true
OpenSource=true
Freeware=true
CommercialUse=true

[Version]
PackageVersion=1.0.0.0
DisplayVersion=1.0.0

[SpecialPaths]
Plugins=NONE

[Dependencies]
UsesGhostscript=no
UsesJava=no
UsesDotNetVersion=
Requires64bitOS=no
RequiresAdmin=no

[Control]
Icons=1
Start=ZenBrowserPortable.exe
BaseAppID=%BASELAUNCHERPATH%\App\zen\zen.exe

[Associations]
FileTypes=html,htm,xhtml,xhtm,xht,shtml,svg,webp,json,pdf
FileTypeCommandLine=%1
Protocols=http,https,ftp
ProtocolCommandLine=%1
