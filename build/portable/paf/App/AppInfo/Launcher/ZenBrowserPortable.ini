[Launch]
ProgramExecutable=zen\zen.exe
CommandLineArguments='--profile "%PAL:DataDir%\profile" --no-remote'
DirectoryMoveOK=yes
SingleAppInstance=false
WaitForOtherInstances=true
MinOS=7
CleanTemp=true

[Activate]
Registry=true

[Environment]
TEMP=%PAL:DataDir%\temp
TMP=%PAL:DataDir%\temp
MOZ_CRASHREPORTER_DISABLE=1

; Back up and restore any local Zen data directories
; This handles profiles.ini and other global data Zen may write to APPDATA
[DirectoriesMove]
data=%APPDATA%\zen

[DirectoriesCleanupIfEmpty]
1=%APPDATA%\zen
2=%LOCALAPPDATA%\zen

; Preferences file handling - seed user.js on first run
[FileWrite1]
Type=Replace
File=%PAL:DataDir%\profile\user.js
IfNotExists=ignore
